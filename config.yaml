project:
  artist_name: "krummholz"
  release_title: "nocere"
  release_type: "EP"           # EP | Album | Single
  release_date: "2026-03-03"   # YYYY-MM-DD (upcoming or recent)

  # One or two sentence "elevator pitch" for the project
  description: >
    nocere is a breakup record about discovering the courage to be radically selfish; to be an asshole to save the world, those we love, and oneself.

    nocere is about uncontrolled hyper-empathy, fear, addiction, guilt, dreaming, lust, and acceptance. 
    
    nocere engages Horse, a 'part' of humans that wants to help us love humans and the world we share with them.
    
    Horse is powerful; it can inhabit others, intuiting their needs, dreams, suffering...
    but often, Hores is meeked in pursuit of ends we do not ourselves know or want.

    the now-culture grows narcissists with broken egos, who know nothing of themselves, nor how they might love an other.
    
    it is relentless. it operates undirected, without goal or intention. it the fault of no human.
    it convinces us to live ourselves as we are to others, and not as we could know ourselves to be.
    it does this by pulling each feeler outside of their felt and offering as replacement a synthetic, unfillable scaffold.
    
    and so it is of little surprise that we might be captivated (and even inspired) by idols who appear to know themselves totally, and so live by no such scaffold;
    even if this understanding contains nothing of love, but instead indifference, greed, exploitation, self-importance, malice.
    
    fueling our attraction is a lust to be freed of Horse, a freedom we believe allows the loving of oneself.
    but Horse wants not for death, as to which these idols have put theirs, and self-actualization this act will never beget.

    instead, we must first thank Horse for its service, recognize its loyalty, benevolence;
    then we must earn its trust to be meeked once again, but now in pursuit of an all-love.

    why there is anything to be earned, one having already spent years in-saddle?
    the answer is living within all those traumas of being wronged, used, infantilized, abused, mocked, overlooked, othered, belittled, ...
    
    the hurt of these sufferings, while initiated by an other, can be wrought by none but the self.
    some of this hurt is to be felt; it is not to be escaped
    
    but as simultaneous subjects and objects of pain, acceptance is undermined by the need to make discrete what can only be whole (the utility of which our experiences ceaselessly re-prove).
    and so we assign the culpable other control of our hurt, which can never be.
    and from this act on, we go assign ourselves those same burdens of others which we, despite every possible effort, cannot bear.
    
    loyal Horse accepts this lot and adjusts its gait.
    we've told it that to be loved is to feel no pain (at the mercy of an other), and so to love is to shield, to control, to contain;
  
    and so Horse takes on the hurt (whether past/present/future) of all those whom we seek to love; 
    the validity of that love now predicated, as far as Horse knows, on controlling their pain.

    Horse is diligent and steadfast; from inside others, it stands watch against its named enemy.
    it alerts us with fear, and by using its powers, with vivid abstractions of the adversary.

    but, over time, this burden grows too heavy; fatigue, apathy, resentment take root in Horse.
    eventually, if too long left neglected, it even begins to forget the source of its resolve [LOVE].
    emaciated and weary, Horse dies quietly at its post; and so with it our love for the world.

    

    (acceptance of the pain we cause others)

    from sept-dec 2025, each song was written/recorded/produced/mixed/mastered in compact, ~1-3 day periods using only my laptop's built-in mic & stock ableton.

