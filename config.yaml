pipeline:
  max_results_per_category: 20   # how many leads to surface per category
  min_quality_score: 3           # 1–5; leads below this are dropped
  recency_cutoff_days: 180       # skip sources with no activity in N days
  search_web: true               # enable live web search via Claude API
  categories:
    - playlists_curators
    - online_communities
    - youtube_streamers

  # Extra keywords to bias searches (leave empty [] for auto)
  extra_keywords: []

output:
